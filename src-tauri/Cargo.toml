[package]
name = "physics-motion-studio"
version = "1.5.4"
description = "A two-dimensional physics motion editor and simulator"
authors = ["ForDecadever"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"
repository = "https://github.com/ForDecadever/physics-motion-studio"

[lib]
name = "physics_motion_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
